<!doctype html>
<html><head><meta charset="utf-8"><title>Swarm Survivor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif}
canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;
  if(state==='level'&&'123'.includes(e.key))pick(+e.key-1);
  if(state==='dead'&&e.key.toLowerCase()==='r')reset();
  if(state==='title'&&(e.key===' '||e.key==='Enter'))reset();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keydown',e=>{if(e.key.toLowerCase()==='p'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play'});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
let mouse={x:0,y:0};
cv.addEventListener('click',e=>{
  if(state==='level'){const i=cards.findIndex(c=>e.clientX>c.x&&e.clientX<c.x+c.w&&e.clientY>c.y&&e.clientY<c.y+c.h);if(i>=0)pick(i)}
  else if(state==='dead'||state==='title')reset()});

const UPS=[
 {n:'Damage +25%',d:'Hit harder',f:p=>p.dmg*=1.25},
 {n:'Fire Rate +20%',d:'Shoot faster',f:p=>p.rate*=1.2},
 {n:'Multishot +1',d:'Extra projectile',f:p=>p.multi++},
 {n:'Piercing +1',d:'Shots go through enemies',f:p=>p.pierce++},
 {n:'Speed +12%',d:'Move faster',f:p=>p.spd*=1.12},
 {n:'Max HP +25',d:'And heal 25',f:p=>{p.max+=25;p.hp=Math.min(p.max,p.hp+25)}},
 {n:'Magnet +50%',d:'Grab gems from further',f:p=>p.mag*=1.5},
 {n:'Orbit Blade',d:'Blade circles you (stacks)',f:p=>p.orbs++},
 {n:'Regen +0.5/s',d:'Slowly heal',f:p=>p.regen+=0.5},
 {n:'Shot Speed +30%',d:'Faster bullets',f:p=>p.bspd*=1.3},
 {n:'Nova',d:'Every 5s blast nearby foes',f:p=>p.nova++},
];
let state='title',P,E,B,G,P2,t,kills,best=+localStorage.ss_best||0,cards=[],spawnT,cam,shake=0,parts;
function reset(){
  P={x:0,y:0,r:12,hp:100,max:100,spd:170,dmg:10,rate:2,multi:1,pierce:0,bspd:420,mag:70,orbs:0,regen:0,nova:0,
     cd:0,inv:0,lvl:1,xp:0,need:5,ang:0,novaT:0};
  E=[];B=[];G=[];parts=[];t=0;kills=0;spawnT=0;cam={x:0,y:0};state='play';
}
function lvlUp(){state='level';P.lvl++;P.xp-=P.need;P.need=Math.floor(P.need*1.35+3);
  const pool=[...UPS].sort(()=>Math.random()-.5).slice(0,3);
  const w=Math.min(220,(W-80)/3),gap=20,x0=W/2-(3*w+2*gap)/2;
  cards=pool.map((u,i)=>({u,x:x0+i*(w+gap),y:H/2-90,w,h:180}));}
function pick(i){if(!cards[i])return;cards[i].u.f(P);state='play';if(P.xp>=P.need)lvlUp()}
function boom(x,y,c,n=6){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.4+Math.random()*.3,c})}}
function spawn(){
  const a=Math.random()*6.28,d=Math.max(W,H)*.6;
  const x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d,m=1+t/60*.5,r=Math.random();
  let e={x,y,r:11,hp:20*m,spd:60+Math.random()*20+t*.3,c:'#e55',dmg:8,xp:1};
  if(r<.15&&t>20)e={x,y,r:8,hp:10*m,spd:130+t*.3,c:'#fa3',dmg:5,xp:1};
  else if(r<.25&&t>45)e={x,y,r:20,hp:90*m,spd:45,c:'#a5e',dmg:15,xp:4};
  else if(r<.27&&t>90)e={x,y,r:34,hp:600*m,spd:55,c:'#f2a',dmg:25,xp:20,boss:1};
  E.push(e);
}
function hurt(d){if(P.inv>0)return;P.hp-=d;P.inv=.5;shake=8;boom(P.x,P.y,'#fff',10);
  if(P.hp<=0){state='dead';if(t>best){best=t;localStorage.ss_best=t}}}
function nearest(){let b=null,bd=1e9;for(const e of E){const d=(e.x-P.x)**2+(e.y-P.y)**2;if(d<bd){bd=d;b=e}}return b}
function dmgE(e,d){e.hp-=d;e.flash=.08;if(e.hp<=0&&!e.dead){e.dead=1;kills++;G.push({x:e.x,y:e.y,v:e.xp});boom(e.x,e.y,e.c,8)}}
function update(dt){
  t+=dt;
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const l=Math.hypot(dx,dy)||1;P.x+=dx/l*P.spd*dt;P.y+=dy/l*P.spd*dt;
  P.inv-=dt;P.hp=Math.min(P.max,P.hp+P.regen*dt);P.ang+=dt*3;
  // spawning
  spawnT-=dt;const rate=Math.max(.12,.9-t/150);
  while(spawnT<=0){spawnT+=rate;const n=1+Math.floor(t/50);for(let i=0;i<n;i++)spawn()}
  // shooting
  P.cd-=dt;
  if(P.cd<=0){const n=nearest();if(n){P.cd=1/P.rate;const base=Math.atan2(n.y-P.y,n.x-P.x);
    for(let i=0;i<P.multi;i++){const a=base+(i-(P.multi-1)/2)*.18;
      B.push({x:P.x,y:P.y,vx:Math.cos(a)*P.bspd,vy:Math.sin(a)*P.bspd,l:1.4,p:P.pierce,hit:new Set()})}}}
  for(const b of B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    for(const e of E)if(!e.dead&&!b.hit.has(e)&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){
      b.hit.add(e);dmgE(e,P.dmg);e.x+=b.vx*dt*.5;e.y+=b.vy*dt*.5;if(b.p--<=0){b.l=0;break}}}
  B=B.filter(b=>b.l>0);
  // orbit blades
  for(let i=0;i<P.orbs;i++){const a=P.ang+i*6.28/P.orbs,ox=P.x+Math.cos(a)*55,oy=P.y+Math.sin(a)*55;
    for(const e of E)if(!e.dead&&Math.hypot(e.x-ox,e.y-oy)<e.r+9&&(!e.ot||e.ot<t)){e.ot=t+.3;dmgE(e,P.dmg*.8)}}
  // nova
  if(P.nova){P.novaT+=dt;if(P.novaT>5){P.novaT=0;shake=6;for(const e of E)if(Math.hypot(e.x-P.x,e.y-P.y)<110+40*P.nova)dmgE(e,P.dmg*3*P.nova);
    for(let i=0;i<30;i++)boom(P.x,P.y,'#8cf',1);P.novaFx=.25}}
  if(P.novaFx>0)P.novaFx-=dt;
  // enemies
  for(const e of E){const a=Math.atan2(P.y-e.y,P.x-e.x);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;
    if(e.flash>0)e.flash-=dt;
    if(Math.hypot(e.x-P.x,e.y-P.y)<e.r+P.r)hurt(e.dmg);}
  // soft separation
  for(let i=0;i<E.length;i++)for(let j=i+1;j<Math.min(E.length,i+12);j++){const a=E[i],b=E[j],d=Math.hypot(a.x-b.x,a.y-b.y),m=a.r+b.r;
    if(d<m&&d>0){const k=(m-d)/2/d;a.x+=(a.x-b.x)*k*.5;a.y+=(a.y-b.y)*k*.5;b.x-=(a.x-b.x)*k*.5;b.y-=(a.y-b.y)*k*.5}}
  E=E.filter(e=>!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<2500);
  // gems
  for(const g of G){const d=Math.hypot(P.x-g.x,P.y-g.y);if(d<P.mag||g.m){g.m=1;const a=Math.atan2(P.y-g.y,P.x-g.x);g.x+=Math.cos(a)*400*dt;g.y+=Math.sin(a)*400*dt}
    if(d<P.r+6){g.d=1;P.xp+=g.v}}
  G=G.filter(g=>!g.d);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
  if(P.xp>=P.need)lvlUp();
  shake*=.9;
}
function draw(){
  cam.x=P.x-W/2;cam.y=P.y-H/2;
  ctx.fillStyle='#161a22';ctx.fillRect(0,0,W,H);
  ctx.save();if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.translate(-cam.x,-cam.y);
  ctx.strokeStyle='#1f2530';ctx.lineWidth=1;ctx.beginPath();
  for(let x=Math.floor(cam.x/64)*64;x<cam.x+W;x+=64){ctx.moveTo(x,cam.y);ctx.lineTo(x,cam.y+H)}
  for(let y=Math.floor(cam.y/64)*64;y<cam.y+H;y+=64){ctx.moveTo(cam.x,y);ctx.lineTo(cam.x+W,y)}
  ctx.stroke();
  for(const g of G){ctx.fillStyle='#4f8';ctx.fillRect(g.x-3,g.y-3,6,6)}
  for(const e of E){ctx.fillStyle=e.flash>0?'#fff':e.c;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.28);ctx.fill();
    if(e.boss){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()}}
  ctx.fillStyle='#ff6';for(const b of B){ctx.beginPath();ctx.arc(b.x,b.y,4,0,6.28);ctx.fill()}
  for(let i=0;i<P.orbs;i++){const a=P.ang+i*6.28/P.orbs;ctx.fillStyle='#8cf';ctx.beginPath();ctx.arc(P.x+Math.cos(a)*55,P.y+Math.sin(a)*55,9,0,6.28);ctx.fill()}
  if(P.novaFx>0){ctx.strokeStyle='rgba(140,200,255,'+P.novaFx*4+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(P.x,P.y,(110+40*P.nova)*(1-P.novaFx*4+.2),0,6.28);ctx.stroke()}
  ctx.fillStyle=P.inv>0&&Math.floor(t*20)%2?'#fff':'#5cf';ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,6.28);ctx.fill();
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l*2);ctx.fillStyle=p.c;ctx.fillRect(p.x-2,p.y-2,4,4)}
  ctx.globalAlpha=1;ctx.restore();
  // HUD
  ctx.fillStyle='#000a';ctx.fillRect(0,0,W,22);ctx.fillStyle='#4af';ctx.fillRect(0,0,W*Math.min(1,P.xp/P.need),22);
  ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='left';ctx.fillText('LV '+P.lvl,8,16);
  ctx.textAlign='center';const m=Math.floor(t/60),s=Math.floor(t%60);ctx.fillText(m+':'+String(s).padStart(2,'0'),W/2,16);
  ctx.textAlign='right';ctx.fillText('Kills '+kills,W-8,16);
  ctx.fillStyle='#000a';ctx.fillRect(10,30,160,14);ctx.fillStyle='#e44';ctx.fillRect(10,30,160*Math.max(0,P.hp/P.max),14);
  ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(10,30,160,14);
}
function overlay(title,sub){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';
  ctx.font='bold 48px system-ui';ctx.fillText(title,W/2,H/2-30);ctx.font='18px system-ui';
  sub.split('\n').forEach((l,i)=>ctx.fillText(l,W/2,H/2+10+i*26))}
let last=performance.now();
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;
  if(state==='title'){ctx.fillStyle='#161a22';ctx.fillRect(0,0,W,H);
    overlay('SWARM SURVIVOR','WASD / arrows to move. You shoot automatically.\nCollect green gems, level up, get absurdly powerful.\nSurvive as long as you can. P = pause.\n\nClick or press SPACE to start'+(best?'\nBest: '+Math.floor(best/60)+':'+String(Math.floor(best%60)).padStart(2,'0'):''))}
  else{
    if(state==='play')update(dt);
    draw();
    if(state==='pause')overlay('PAUSED','Press P to resume');
    if(state==='level'){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.fillText('LEVEL UP!',W/2,H/2-130);
      cards.forEach((c,i)=>{ctx.fillStyle='#2a3344';ctx.fillRect(c.x,c.y,c.w,c.h);ctx.strokeStyle='#5cf';ctx.lineWidth=2;ctx.strokeRect(c.x,c.y,c.w,c.h);
        ctx.fillStyle='#fff';ctx.font='bold 18px system-ui';ctx.fillText(c.u.n,c.x+c.w/2,c.y+60);ctx.font='14px system-ui';ctx.fillStyle='#aab';ctx.fillText(c.u.d,c.x+c.w/2,c.y+95);
        ctx.fillStyle='#5cf';ctx.fillText('['+(i+1)+']',c.x+c.w/2,c.y+150)})}
    if(state==='dead')overlay('YOU DIED','Survived '+Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+'  |  '+kills+' kills  |  Level '+P.lvl+'\nBest: '+Math.floor(best/60)+':'+String(Math.floor(best%60)).padStart(2,'0')+'\n\nPress R or click to retry');
  }
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
